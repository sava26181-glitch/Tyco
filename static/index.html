  p.innerHTML = `<h1>Профиль</h1>${seg("me", [["stats", "Навыки"], ["items", "Вещи"], ["top", "Рейтинг"], ["shop", "Магазин"]])}<div id="mv"></div>`;
  const mv = $("mv"), st = ME.st, names = { stamina: "Выносливость", charm: "Харизма", smart: "Хватка", rep: "Репутация", net: "Связи", health: "Здоровье" };
  if (SUB.me === "stats") {
    mv.innerHTML = `<canvas class="hero" id="cv"></canvas><div class="status"><div><small>Статус</small><b>${esc(ME.tier)} · ${ME.rating}</b></div><small>${ME.ride ? esc(CFG.shop.find(x => x.id === ME.ride).name) : "пешком"}</small></div>
      <div class="card" style="padding:6px 16px">${Object.keys(names).map(k => `<div class="stat"><span>${names[k]}</span><div class="prog"><i style="width:${st[k] || 0}%"></i></div><b>${st[k] || 0}</b></div>`).join("")}</div>
      <button class="btn" id="photo">Сделать фото на аватарку</button><button class="btn2" id="look">Сменить образ</button><button class="btn2" id="friends">Позвать друга · +${money(CFG.refBonus)} обоим</button>
      <h2>Витрина</h2><div class="g3" id="show"><div class="skel"></div></div>`;
    drawHero($("cv"), heroLook(), "stand", {});
    $("photo").onclick = takePhoto; $("look").onclick = () => createScreen(true);
    $("friends").onclick = () => { if (!CFG.invite || !tg) return toast("Ссылка пока не настроена"); tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(CFG.invite) + "&text=" + encodeURIComponent("Го из курьеров в магнаты")); };
    $("show").onclick = e => { const b = e.target.closest("[data-g]"); if (!b || !SHOWN) return; const g = SHOWN.find(x => x.id == b.dataset.g); openModal(`<div style="width:180px;margin:0 auto 12px;border-radius:16px;overflow:hidden">${gsvg(g.kind, g.model || "", g.backdrop, g.pattern)}</div><h2 style="text-align:center">${esc(g.name)} #${fmt(g.num)}</h2>${attrs(g)}`); };
    api("profile", {}).then(r => { if (tab !== "me" || SUB.me !== "stats") return; SHOWN = r.gifts; $("show").innerHTML = r.gifts.length ? r.gifts.map(giftTile).join("") : `<p class="sub" style="grid-column:1/-1">Пусто. Купи подарок во вкладке NFT.</p>`; }).catch(() => {});
  } else if (SUB.me === "items") {
    const sec = (kind, title, hint) => `<h2>${title}</h2><p class="sub">${hint}</p><div class="list">${CFG.shop.filter(s => s.kind === kind).map(s => { const own = ME.clothes.includes(s.id), on = ME.wear === s.id || ME.ride === s.id; return `<button class="item ${!own && s.aura > ME.aura ? "lock" : ""}" data-why="Не хватает денег" data-s="${s.id}"><span class="t"><b>${esc(s.name)}</b><small>+${s.charm} к харизме${s.pay ? ` · +${money(s.pay)} за смену` : ""}</small></span><span class="price ${own ? "off" : ""}">${on ? "выбрано" : own ? "выбрать" : money(s.aura)}</span></button>`; }).join("")}</div>`;
    mv.innerHTML = sec("ride", "Транспорт", "Повышает оплату смены.") + sec("wear", "Одежда", "Меняет внешний вид персонажа.");
    p.onclick = async e => { const b = e.target.closest("[data-s]"); if (!b) return; const r = await call("shop", { id: b.dataset.s }, b); if (r) { toast(r.text); render(); } };
  } else if (SUB.me === "top") {
    mv.innerHTML = '<div class="skel"></div><div class="skel"></div>';
    api("top").then(r => { if (SUB.me !== "top" || tab !== "me") return; mv.innerHTML = `<p class="sub">Твоё место: ${r.rank}</p>${r.top.map((u, i) => `<div class="lb ${u.id === r.me ? "me" : ""}"><span>${i + 1}</span><span>${esc(u.name)} <small style="color:var(--dim)">${esc(u.tier)}</small></span><span>${u.rating}</span></div>`).join("") || '<p class="sub">Пока пусто.</p>'}`; }).catch(err => toast(err.message));
  } else {
    mv.innerHTML = `<p class="sub">Оплата звёздами Telegram.</p><div class="list">${CFG.packs.map(p => `<button class="item ${p.vip && ME.vip ? "lock" : ""}" data-why="VIP уже есть" data-p="${p.id}"><span class="t"><b>${esc(p.title)}</b><small>${p.aura ? money(p.aura) : ""}</small></span><span class="price">${p.stars} Stars</span></button>`).join("")}</div>`;
    p.onclick = e => { const b = e.target.closest("[data-p]"); if (b) buy(b.dataset.p, b); };
  }
}
async function buy(pack, btn) {
  toast("Открываю оплату");
  const r = await call("invoice", { pack }, btn); if (!r) return;
  tg.openInvoice(r.link, async status => { if (status !== "paid") return; toast("Оплачено, начисляю"); for (let i = 0; i < 6; i++) { await new Promise(w => setTimeout(w, 1200)); const before = ME.aura + "|" + ME.energy + "|" + ME.vip; await refreshMe(); if (ME.aura + "|" + ME.energy + "|" + ME.vip !== before) break; } closeModal(); render(); });
}
let adCtl = null;
function loadAds() { if (!CFG.adsBlock || CFG.adsBlock === "-" || adCtl) return; const s = document.createElement("script"); s.src = "https://sad.adsgram.ai/js/sad.min.js"; s.async = true; s.onload = () => { try { adCtl = window.Adsgram.init({ blockId: CFG.adsBlock }); } catch (e) {} }; document.head.appendChild(s); }
function refillModal() {
  openModal(`<h2>Нет энергии</h2><p class="sub">+1 ⚡ каждые 15 минут. Или восполни сразу.</p>${adCtl ? `<button class="btn" id="ad">Посмотреть рекламу</button>` : ""}<button class="btn2" id="st">Полная энергия · 15 Stars</button>`);
  if ($("ad")) $("ad").onclick = async e => { e.target.disabled = true; let ok = false; try { const r = await adCtl.show(); ok = r && r.done; } catch (err) {} if (!ok) return toast("Реклама недоступна"); for (let i = 0; i < 6; i++) { try { const r = await api("ad/claim"); setMe(r.me); closeModal(); render(); return toast("Энергия восполнена"); } catch (err) { await new Promise(w => setTimeout(w, 1000)); } } toast("Не удалось подтвердить просмотр"); };
  $("st").onclick = e => buy("energy", e.target);
}
async function refreshMe() { const r = await api("me"); CFG = r.config; setMe(r.me); }

function portrait() {
  const c = document.createElement("canvas"); c.width = c.height = 720; c.style.width = c.style.height = "720px";
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 720); g.addColorStop(0, "#26262b"); g.addColorStop(1, "#111113"); x.fillStyle = g; x.fillRect(0, 0, 720, 720);
  const main = ctx; ctx = x; LOOKS.__me = heroLook(); drawPerson("__me", 360, 1120, 4.3, 1, mixPose(POSES.stand, {}, 0), { seed: 3 }); ctx = main;
  x.fillStyle = "#0e0e10e6"; x.beginPath(); x.roundRect(210, 620, 300, 58, 14); x.fill();
  x.fillStyle = "#ededef"; x.font = "600 30px -apple-system, system-ui, sans-serif"; x.textAlign = "center"; x.fillText(ME.tier + " · " + ME.rating, 360, 659);
  return c.toDataURL("image/png");
}
function takePhoto() {
  const png = portrait();
  openModal(`<h2>Фото готово</h2><img src="${png}" style="width:100%;border-radius:50%;display:block;margin:10px 0 14px"><button class="btn" id="send">Отправить в чат с ботом</button><p class="sub" style="text-align:center;margin-top:8px">Открой фото в чате и поставь его на аватарку.</p>`);
  $("send").onclick = async e => { if (await call("photo", { png }, e.target)) { toast("Фото в чате с ботом"); closeModal(); } };
}

setInterval(() => { sceneT += .06; const cv = $("cv"); if (!cv) return; if (NEW) drawHero(cv, lookOf(NEW, {}), "stand", {}); else if (ME && ME.char && (tab === "home" || (tab === "me" && SUB.me === "stats"))) drawHero(cv, heroLook(), "stand", {}); }, 60);
(async function boot() {
  try { const c = JSON.parse(localStorage.getItem("ty-cache") || "null"); if (c && c.me && c.cfg && c.me.char) { CFG = c.cfg; setMe(c.me); render(); } } catch (e) {}
  try { await refreshMe(); loadAds(); if (!$("modal").classList.contains("on")) render(); }
  catch (err) { if (!ME) $("page").innerHTML = `<h1>Не удалось загрузиться</h1><p class="sub">${esc(err.message)}</p><button class="btn" onclick="location.reload()">Повторить</button>`; else toast(err.message); }
})();
</script>
</body>
</html>
