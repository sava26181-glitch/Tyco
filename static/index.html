function npcLook(c) { return lookOf({ g: c.g, skin: c.look.skin, hc: c.look.hair, hair: c.look.style, eyes: "#3a2618" }, { top: c.look.top, body: 40 }); }

const STATUS = { chat: "Пишет тебе", date: "Ждёт свидания 💫", couple: "Вы вместе ❤️", friend: "Друзья", cold: "Разговор остыл" };

  if (buying) actions = g.mine ? `<button class="ghost" id="unlist">Снять с продажи</button>` : `<button class="big ${g.price > ME.aura ? "lock" : ""}" data-why="Не хватает денег" id="mbuy">КУПИТЬ ЗА ${fmt(g.price)} 💵</button><p class="sub" style="text-align:center;margin-top:6px">Продавец: ${esc(g.seller)}</p>`;
  else actions = `${g.model ? "" : `<button class="big ${upCost > ME.aura ? "lock" : ""}" data-why="Не хватает денег" id="up">✨ УЛУЧШИТЬ ЗА ${fmt(upCost)} 💵</button>`}
    ${g.price ? `<button class="ghost" id="unlist">Снять с продажи (${fmt(g.price)} 💵)</button>` : `<div class="row" style="margin-top:9px"><input id="pr" type="number" inputmode="numeric" placeholder="Цена" style="flex:1"><button class="buy" id="sell">Продать</button></div>`}
    <button class="ghost" id="show">${g.shown ? "Скрыть из профиля" : "Показать в профиле"}</button>`;
  openModal(`<div style="max-width:170px;margin:0 auto 10px">${giftTile(g)}</div><h2 style="text-align:center">${esc(g.name)} #${fmt(g.num)}</h2>${attrs(g)}${actions}`);
  const reload = async () => { closeModal(); await refreshMe(); giftScreen($("page")); };
  if ($("up")) $("up").onclick = async e => { const r = await call("gift/up", { id: g.id }, e.target); if (r) { beep(990, .4, .08); GDATA = r; giftModal(r.gift); toast("Готово! Смотри, что выпало"); refreshMe(); } };
  if ($("sell")) $("sell").onclick = async e => { const v = +$("pr").value; if (!v) return toast("Введи цену"); if (await call("gift/sell", { id: g.id, price: v }, e.target)) { toast("Выставлено на маркет"); reload(); } };
  if ($("unlist")) $("unlist").onclick = async e => { if (await call("gift/sell", { id: g.id, price: null }, e.target)) reload(); };
  if ($("show")) $("show").onclick = async e => { if (await call("gift/show", { id: g.id }, e.target)) reload(); };
  if ($("mbuy")) $("mbuy").onclick = async e => { const r = await call("market/buy", { id: g.id, price: g.price }, e.target); if (r) { GT = "mine"; reload(); toast("Подарок твой!"); } };
}

function wardrobe() {
  openModal(`<h2>Транспорт и шмот</h2><p class="sub">Транспорт повышает оплату смены. Каждая покупка один раз добавляет харизму.</p>${CFG.shop.map(s => { const own = ME.clothes.includes(s.id), on = ME.wear === s.id || ME.ride === s.id; return `<div class="card row"><div class="t"><b>${RIDES[s.id] || "👕"} ${esc(s.name)}</b><small>+${s.charm} к харизме${s.pay ? ` · +${s.pay} 💵 за смену` : ""}</small></div><button class="buy ${on ? "alt" : ""} ${!own && s.aura > ME.aura ? "lock" : ""}" data-why="Не хватает денег" data-s="${s.id}">${on ? "Выбрано" : own ? "Выбрать" : fmt(s.aura) + " 💵"}</button></div>`; }).join("")}`);
  $("box").onclick = async e => { const b = e.target.closest("[data-s]"); if (!b) return; const r = await call("shop", { id: b.dataset.s }, b); if (r) { toast(r.text); wardrobe(); if (tab === "me") meScreen($("page")); } };
}
async function topModal() {
  openModal(`<h2>Топ по статусу</h2><p class="sub">Загружаю…</p>`);
  let r; try { r = await api("top"); } catch (err) { return toast(err.message); }
  openModal(`<h2>Топ по статусу</h2><p class="sub">Твоё место: ${r.rank}</p>${r.top.map((u, i) => `<div class="lb ${u.id === r.me ? "me" : ""}"><span>${i + 1}</span><span>${esc(u.name)} · <small style="color:var(--dim)">${esc(u.tier)}</small></span><span>${u.rating}</span></div>`).join("") || '<p class="sub">Пока пусто.</p>'}`);
}
function shopModal() {
  openModal(`<h2>Магазин</h2><p class="sub">Оплата звёздами Telegram.</p>${CFG.packs.map(p => `<div class="card row"><div class="t"><b>${esc(p.title)}</b><small>${p.aura ? fmt(p.aura) + " 💵" : ""}</small></div><button class="buy ${p.vip && ME.vip ? "lock" : ""}" data-why="VIP уже есть" data-p="${p.id}">⭐ ${p.stars}</button></div>`).join("")}`);
  $("box").onclick = e => { const b = e.target.closest("[data-p]"); if (b) buy(b.dataset.p, b); };
}
async function buy(pack, btn) {
  if (DEMO) return toast("В демо покупки отключены");
  const r = await call("invoice", { pack }, btn); if (!r) return;
  tg.openInvoice(r.link, async status => { if (status !== "paid") return; toast("Оплачено, начисляю…"); for (let i = 0; i < 6; i++) { await new Promise(w => setTimeout(w, 1200)); const before = ME.aura + "|" + ME.energy + "|" + ME.vip; await refreshMe(); if (ME.aura + "|" + ME.energy + "|" + ME.vip !== before) break; } closeModal(); render(); });
}
let adCtl = null;
function loadAds() { if (!CFG.adsBlock || adCtl) return; const s = document.createElement("script"); s.src = "https://sad.adsgram.ai/js/sad.min.js"; s.onload = () => { try { adCtl = window.Adsgram.init({ blockId: CFG.adsBlock }); } catch (e) {} }; document.head.appendChild(s); }
function refillModal() {
  openModal(`<h2>Нет энергии</h2><p class="sub">+1 ⚡ каждые 15 минут. Или восполни сразу.</p>${adCtl || DEMO ? `<button class="big" id="ad">СМОТРЕТЬ РЕКЛАМУ</button>` : ""}<button class="ghost" id="st">Полная энергия за ⭐ 15</button>`);
  if ($("ad")) $("ad").onclick = async e => { e.target.disabled = true; let ok = DEMO; if (!DEMO) { try { const r = await adCtl.show(); ok = r && r.done; } catch (err) { ok = false; } } if (!ok) return toast("Реклама недоступна"); for (let i = 0; i < 6; i++) { try { const r = await api("ad/claim"); setMe(r.me); closeModal(); render(); return toast("Энергия восполнена"); } catch (err) { await new Promise(w => setTimeout(w, 1000)); } } toast("Не удалось подтвердить просмотр"); };
  $("st").onclick = e => buy("energy", e.target);
}
async function refreshMe() { const r = await api("me"); setMe(r.me); CFG = r.config; }

/* ---------- Фото ---------- */
function portrait() {
  const c = document.createElement("canvas"); c.width = c.height = 720; c.style.width = c.style.height = "720px";
  const x = c.getContext("2d"), col = tierColor(ME.rating);
  const g = x.createRadialGradient(360, 300, 40, 360, 360, 520); g.addColorStop(0, "#4a2f86"); g.addColorStop(.55, "#1c1636"); g.addColorStop(1, "#0c0b16"); x.fillStyle = g; x.fillRect(0, 0, 720, 720);
  x.globalAlpha = .5; x.strokeStyle = col; x.lineWidth = 3; for (let i = 0; i < 12; i++) { x.beginPath(); x.moveTo(360, 300); x.lineTo(360 + Math.cos(i * .52) * 600, 300 + Math.sin(i * .52) * 600); x.stroke(); } x.globalAlpha = 1;
  const main = ctx; ctx = x; LOOKS.__me = heroLook(); drawPerson("__me", 360, 1120, 4.3, 1, mixPose(POSES.stand, {}, 0), { seed: 3 }); ctx = main;
  x.fillStyle = "#0c0b16dd"; x.beginPath(); x.roundRect(200, 610, 320, 74, 37); x.fill(); x.strokeStyle = col; x.lineWidth = 5; x.stroke();
  x.fillStyle = col; x.font = "900 40px Impact, system-ui, sans-serif"; x.textAlign = "center"; x.fillText(ME.tier.toUpperCase() + " · " + ME.rating, 360, 662);
  return c.toDataURL("image/png");
}
async function takePhoto(e) {
  const png = portrait();
  openModal(`<h2>Фото готово 📸</h2><img src="${png}" style="width:100%;border-radius:50%;display:block;margin-bottom:12px"><button class="big" id="send">ОТПРАВИТЬ В ЧАТ С БОТОМ</button><p class="sub" style="text-align:center;margin-top:8px">Открой фото в чате, нажми «⋯» → «Сохранить» и поставь на аватарку.</p>`);
  $("send").onclick = async ev => { if (DEMO) return toast("В демо отправка отключена"); const r = await call("photo", { png }, ev.target); if (r) { toast("Фото в чате с ботом!"); closeModal(); } };
}

/* ---------- Цикл ---------- */
let last = performance.now();
function frame(t) { sceneT += (t - last) / 1000; last = t; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
setInterval(() => { const cv = $("cv"); if (cv && ME && ME.char && !NEW && tab === "me") drawHero(cv, heroLook(), "stand", { glow: tierColor(ME.rating) + "55" }); else if (cv && NEW) drawHero(cv, lookOf(NEW, {}), "stand", { glow: "#b26bff55" }); }, 60);
(async function boot() {
  try { await refreshMe(); loadAds(); render(); }
  catch (err) { $("page").innerHTML = `<h2>Не получилось загрузиться</h2><p class="sub">${esc(err.message)}</p><button class="big" onclick="location.reload()">ЕЩЁ РАЗ</button>`; }
})();
function DEMO_API() { throw new Error("Откройте игру через Telegram"); }
/*DEMO*/
</script>
